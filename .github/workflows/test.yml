name: Python Tests with Allure Report

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 安装 Java 和 Allure 命令行工具
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless
          curl -L --fail -o allure.tgz 'https://github.com/allure-framework/allure2/releases/download/2.34.0/allure-2.34.0.tgz'
          tar -xzf allure.tgz
          sudo mv allure-2.34.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: 5. 运行测试并收集结果
        run: |
          pytest --alluredir=./allure-results
        continue-on-error: true

      - name: 6. 生成 HTML 报告
        run: |
          allure generate ./allure-results -o ./allure-report --clean

      - name: 7. 发布报告到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report