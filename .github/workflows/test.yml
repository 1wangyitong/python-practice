name: 自动化测试流水线

on:
  push:
    branches: [ "main" ] # 只要你向 main 分支推送代码，就触发

jobs:
  test:
    runs-on: ubuntu-latest # 云端免费提供一台 Ubuntu Linux 服务器

    steps:
    - name: 1. 拉取你的代码
      uses: actions/checkout@v3

    - name: 2. 安装 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. 安装项目依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. 运行 Pytest 测试
      run: |
        python -m pytest testcases/

# 这段代码的意思是，让云端机器人在你的代码被推送到 GitHub 时，自动下载代码、安装 Python、安装 requirements.txt 里的所有库，然后自动跑一遍 testcases/ 文件夹里的测试用例。

        